<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UA Radio — Адмінка</title>
  <style>
    :root {
      --bg: #0d1117;
      --surface: #161b22;
      --surface2: #21262d;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --danger: #ef4444;
      --danger-hover: #dc2626;
      --text: #e6edf3;
      --muted: #8b949e;
      --border: #30363d;
      --success: #22c55e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 24px 16px 48px;
    }
    .container { max-width: 900px; margin: 0 auto; }
    h1 { font-size: 1.75rem; margin-bottom: 4px; }
    .subtitle { color: var(--muted); margin-bottom: 28px; font-size: 0.95rem; }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
    }
    .card h2 { font-size: 1.1rem; margin-bottom: 16px; }
    label {
      display: block;
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 6px;
      margin-top: 12px;
    }
    label:first-of-type { margin-top: 0; }
    input, textarea {
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface2);
      color: var(--text);
      font-size: 0.95rem;
    }
    input:focus, textarea:focus {
      outline: none;
      border-color: var(--primary);
    }
    textarea { resize: vertical; min-height: 60px; }
    .row { display: flex; gap: 12px; flex-wrap: wrap; }
    .row > div { flex: 1; min-width: 140px; }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 10px 18px;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-danger { background: transparent; color: var(--danger); border: 1px solid var(--danger); }
    .btn-danger:hover { background: var(--danger); color: #fff; }
    .btn-ghost { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
    .btn-ghost:hover { background: var(--border); }
    .btn-sm { padding: 6px 12px; font-size: 0.85rem; }
    .actions { margin-top: 16px; display: flex; gap: 10px; flex-wrap: wrap; }
    .station {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 16px;
      border-radius: 10px;
      background: var(--surface2);
      border: 1px solid var(--border);
      margin-bottom: 10px;
    }
    .station.inactive { opacity: 0.5; }
    .station-info { flex: 1; min-width: 0; }
    .station-info h3 {
      font-size: 1rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .station-info p {
      font-size: 0.8rem;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .station-url {
      font-size: 0.75rem;
      color: var(--primary);
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .station-actions { display: flex; gap: 6px; flex-shrink: 0; }
    .badge {
      font-size: 0.7rem;
      padding: 2px 8px;
      border-radius: 999px;
      background: var(--success, #22c55e);
      color: #fff;
      font-weight: 600;
    }
    .badge.off { background: #6b7280; }
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: #22c55e;
      color: #fff;
      padding: 12px 24px;
      border-radius: 8px;
      font-weight: 600;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
      z-index: 100;
    }
    .toast.show { opacity: 1; }
    .toast.error { background: #ef4444; }
    .empty { color: #8b949e; text-align: center; padding: 32px 0; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; flex-wrap: wrap; gap: 8px; }
    .form-title { margin-bottom: 4px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div>
        <h1>UA Radio — Адмінка</h1>
        <p class="subtitle">Керування радіостанціями</p>
      </div>
    </div>

    <div class="card">
      <h2 class="form-title" id="formTitle">Додати радіо</h2>
      <form id="stationForm">
        <input type="hidden" id="editId" />
        <label for="name">Назва *</label>
        <input id="name" required placeholder="Наприклад: Українське радіо" />

        <label for="streamUrl">URL стріму *</label>
        <input id="streamUrl" required placeholder="https://... або http://..." />

        <label for="description">Опис</label>
        <input id="description" placeholder="Короткий опис" />

        <label for="logoUrl">URL логотипу</label>
        <input id="logoUrl" placeholder="https://... (необов'язково)" />

        <div class="row">
          <div>
            <label for="sortOrder">Порядок</label>
            <input id="sortOrder" type="number" value="0" />
          </div>
          <div>
            <label for="isActive">Активне</label>
            <select id="isActive" style="width:100%;padding:10px 12px;border-radius:8px;border:1px solid var(--border);background:var(--surface2);color:var(--text);font-size:0.95rem;">
              <option value="true">Так</option>
              <option value="false">Ні</option>
            </select>
          </div>
        </div>

        <div class="actions">
          <button type="submit" class="btn btn-primary" id="submitBtn">Додати</button>
          <button type="button" class="btn btn-ghost" id="cancelBtn" style="display:none">Скасувати</button>
        </div>
      </form>
    </div>

    <div class="card">
      <h2>Список радіо <span id="count" style="color:var(--muted);font-weight:400;font-size:0.9rem"></span></h2>
      <div id="list"><p class="empty">Завантаження...</p></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    // ⚠️ Встав свої ключі нижче (з Supabase → Settings → API Keys)
    const SUPABASE_URL = 'https://foavkstpeuwxbssfgyee.supabase.co';
    const SUPABASE_KEY = 'PASTE_SECRET_OR_SERVICE_ROLE_KEY_HERE';

    const headers = {
      'apikey': SUPABASE_KEY,
      'Authorization': `Bearer ${SUPABASE_KEY}`,
      'Content-Type': 'application/json',
      'Prefer': 'return=representation'
    };

    const listEl = document.getElementById('list');
    const form = document.getElementById('stationForm');
    const formTitle = document.getElementById('formTitle');
    const submitBtn = document.getElementById('submitBtn');
    const cancelBtn = document.getElementById('cancelBtn');
    const toast = document.getElementById('toast');

    function showToast(msg, isError = false) {
      toast.textContent = msg;
      toast.className = 'toast show' + (isError ? ' error' : '');
      setTimeout(() => toast.className = 'toast', 2500);
    }

    async function loadStations() {
      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/stations?order=sort_order.asc`, { headers });
        if (!res.ok) throw new Error(await res.text());
        const data = await res.json();
        document.getElementById('count').textContent = `(${data.length})`;
        if (!data.length) {
          listEl.innerHTML = '<p class="empty">Немає радіо. Додай перше вище ↑</p>';
          return;
        }
        listEl.innerHTML = data.map(s => `
          <div class="station ${s.is_active ? '' : 'inactive'}">
            <div class="station-info">
              <h3>${escapeHtml(s.name)} <span class="badge ${s.is_active ? '' : 'off'}">${s.is_active ? 'ON' : 'OFF'}</span></h3>
              <p>${escapeHtml(s.description || '')}</p>
              <div class="station-url">${escapeHtml(s.stream_url)}</div>
            </div>
            <div class="station-actions">
              <button class="btn btn-ghost btn-sm" onclick='editStation(${JSON.stringify(s).replace(/'/g, "&#39;")})'>✏️</button>
              <button class="btn btn-danger btn-sm" onclick="deleteStation('${s.id}', '${escapeHtml(s.name)}')">🗑</button>
            </div>
          </div>
        `).join('');
      } catch (e) {
        listEl.innerHTML = `<p class="empty">Помилка завантаження: ${escapeHtml(e.message)}</p>`;
      }
    }

    function escapeHtml(str) {
      return String(str || '').replace(/&/g,'&').replace(/</g,'<').replace(/>/g,'>').replace(/"/g,'"');
    }

    function editStation(s) {
      document.getElementById('editId').value = s.id;
      document.getElementById('name').value = s.name;
      document.getElementById('streamUrl').value = s.stream_url;
      document.getElementById('description').value = s.description || '';
      document.getElementById('logoUrl').value = s.logo_url || '';
      document.getElementById('sortOrder').value = s.sort_order || 0;
      document.getElementById('isActive').value = String(s.is_active);
      formTitle.textContent = 'Редагувати радіо';
      submitBtn.textContent = 'Зберегти';
      cancelBtn.style.display = 'inline-flex';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function resetForm() {
      form.reset();
      document.getElementById('editId').value = '';
      document.getElementById('sortOrder').value = '0';
      document.getElementById('isActive').value = 'true';
      formTitle.textContent = 'Додати радіо';
      submitBtn.textContent = 'Додати';
      cancelBtn.style.display = 'none';
    }

    cancelBtn.onclick = resetForm;

    form.onsubmit = async (e) => {
      e.preventDefault();
      const id = document.getElementById('editId').value;
      const body = {
        name: document.getElementById('name').value.trim(),
        stream_url: document.getElementById('streamUrl').value.trim(),
        description: document.getElementById('description').value.trim() || null,
        logo_url: document.getElementById('logoUrl').value.trim() || null,
        sort_order: Number(document.getElementById('sortOrder').value) || 0,
        is_active: document.getElementById('isActive').value === 'true'
      };

      try {
        let res;
        if (id) {
          res = await fetch(`${SUPABASE_URL}/rest/v1/stations?id=eq.${id}`, {
            method: 'PATCH',
            headers,
            body: JSON.stringify(body)
          });
        } else {
          res = await fetch(`${SUPABASE_URL}/rest/v1/stations`, {
            method: 'POST',
            headers,
            body: JSON.stringify(body)
          });
        }
        if (!res.ok) throw new Error(await res.text());
        showToast(id ? 'Збережено!' : 'Додано!');
        resetForm();
        loadStations();
      } catch (err) {
        showToast('Помилка: ' + err.message, true);
      }
    };

    async function deleteStation(id, name) {
      if (!confirm(`Видалити «${name}»?`)) return;
      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/stations?id=eq.${id}`, {
          method: 'DELETE',
          headers
        });
        if (!res.ok) throw new Error(await res.text());
        showToast('Видалено');
        loadStations();
      } catch (err) {
        showToast('Помилка: ' + err.message, true);
      }
    }

    // Fix editStation to work without broken JSON in HTML
    window.editStation = function(s) {
      if (typeof s === 'string') s = JSON.parse(s);
      document.getElementById('editId').value = s.id;
      document.getElementById('name').value = s.name;
      document.getElementById('streamUrl').value = s.stream_url;
      document.getElementById('description').value = s.description || '';
      document.getElementById('logoUrl').value = s.logo_url || '';
      document.getElementById('sortOrder').value = s.sort_order || 0;
      document.getElementById('isActive').value = String(s.is_active);
      formTitle.textContent = 'Редагувати радіо';
      submitBtn.textContent = 'Зберегти';
      cancelBtn.style.display = 'inline-flex';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    };

    window.deleteStation = deleteStation;

    // Safer list rendering
    async function loadStations() {
      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/stations?order=sort_order.asc`, { headers });
        if (!res.ok) throw new Error(await res.text());
        const data = await res.json();
        document.getElementById('count').textContent = `(${data.length})`;
        if (!data.length) {
          listEl.innerHTML = '<p class="empty">Немає радіо. Додай перше вище ↑</p>';
          return;
        }
        listEl.innerHTML = '';
        data.forEach(s => {
          const div = document.createElement('div');
          div.className = 'station' + (s.is_active ? '' : ' inactive');
          div.innerHTML = `
            <div class="station-info">
              <h3></h3>
              <p></p>
              <div class="station-url"></div>
            </div>
            <div class="station-actions">
              <button class="btn btn-ghost btn-sm edit-btn">✏️</button>
              <button class="btn btn-danger btn-sm del-btn">🗑</button>
            </div>
          `;
          div.querySelector('h3').innerHTML = '';
          div.querySelector('h3').appendChild(document.createTextNode(s.name + ' '));
          const badge = document.createElement('span');
          badge.className = 'badge' + (s.is_active ? '' : ' off');
          badge.textContent = s.is_active ? 'ON' : 'OFF';
          div.querySelector('h3').appendChild(badge);
          div.querySelector('p').textContent = s.description || '';
          div.querySelector('.station-url').textContent = s.stream_url;
          div.querySelector('.edit-btn').onclick = () => window.editStation(s);
          div.querySelector('.del-btn').onclick = () => window.deleteStation(s.id, s.name);
          listEl.appendChild(div);
        });
      } catch (e) {
        listEl.innerHTML = `<p class="empty">Помилка: ${escapeHtml(e.message)}. Перевір SUPABASE_KEY у index.html</p>`;
      }
    }

    loadStations();
  </script>
</body>
</html>
