<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UA Radio — Адмінка</title>
  <style>
    :root {
      --bg: #0d1117;
      --surface: #161b22;
      --surface2: #21262d;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --danger: #ef4444;
      --text: #e6edf3;
      --muted: #8b949e;
      --border: #30363d;
      --success: #22c55e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 24px 16px 48px;
    }
    .container { max-width: 900px; margin: 0 auto; }
    h1 { font-size: 1.75rem; margin-bottom: 4px; }
    .subtitle { color: var(--muted); margin-bottom: 28px; font-size: 0.95rem; }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
    }
    .card h2 { font-size: 1.1rem; margin-bottom: 16px; }
    label {
      display: block;
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 6px;
      margin-top: 12px;
    }
    label:first-of-type { margin-top: 0; }
    input, select {
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface2);
      color: var(--text);
      font-size: 0.95rem;
    }
    input:focus, select:focus { outline: none; border-color: var(--primary); }
    .row { display: flex; gap: 12px; flex-wrap: wrap; }
    .row > div { flex: 1; min-width: 140px; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      padding: 10px 18px; border: none; border-radius: 8px;
      font-size: 0.95rem; font-weight: 600; cursor: pointer;
    }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-danger { background: transparent; color: var(--danger); border: 1px solid var(--danger); }
    .btn-danger:hover { background: var(--danger); color: #fff; }
    .btn-ghost { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
    .btn-sm { padding: 6px 12px; font-size: 0.85rem; }
    .actions { margin-top: 16px; display: flex; gap: 10px; flex-wrap: wrap; }
    .station {
      display: flex; align-items: center; gap: 14px;
      padding: 14px 16px; border-radius: 10px;
      background: var(--surface2); border: 1px solid var(--border); margin-bottom: 10px;
    }
    .station.inactive { opacity: 0.5; }
    .station-info { flex: 1; min-width: 0; }
    .station-info h3 { font-size: 1rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .station-info p { font-size: 0.8rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .station-url { font-size: 0.75rem; color: var(--primary); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .station-actions { display: flex; gap: 6px; flex-shrink: 0; }
    .badge { font-size: 0.7rem; padding: 2px 8px; border-radius: 999px; background: var(--success); color: #fff; font-weight: 600; margin-left: 6px; }
    .badge.off { background: #6b7280; }
    .toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      background: #22c55e; color: #fff; padding: 12px 24px; border-radius: 8px;
      font-weight: 600; opacity: 0; pointer-events: none; transition: opacity 0.3s; z-index: 100;
    }
    .toast.show { opacity: 1; }
    .toast.error { background: #ef4444; }
    .empty { color: var(--muted); text-align: center; padding: 32px 0; }
    #loginScreen { max-width: 420px; margin: 60px auto; }
    #app { display: none; }
    .hint { font-size: 0.8rem; color: var(--muted); margin-top: 8px; }
  </style>
</head>
<body>
  <!-- Login: secret key only in your browser -->
  <div id="loginScreen" class="container">
    <div class="card">
      <h1 style="font-size:1.4rem;margin-bottom:8px">UA Radio — Вхід</h1>
      <p class="subtitle" style="margin-bottom:16px">Встав <b>Secret key</b> з Supabase (Settings → API Keys). Зберігається тільки в цьому браузері.</p>
      <label for="keyInput">Secret / service_role key</label>
      <input id="keyInput" type="password" placeholder="sb_secret_... або eyJ..." autocomplete="off" />
      <p class="hint">Project URL уже заданий: foavkstpeuwxbssfgyee.supabase.co</p>
      <div class="actions">
        <button class="btn btn-primary" id="loginBtn">Увійти</button>
      </div>
    </div>
  </div>

  <div id="app" class="container">
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:4px">
      <div>
        <h1>UA Radio — Адмінка</h1>
        <p class="subtitle">Керування радіостанціями</p>
      </div>
      <button class="btn btn-ghost btn-sm" id="logoutBtn">Вийти</button>
    </div>

    <div class="card">
      <h2 id="formTitle">Додати радіо</h2>
      <form id="stationForm">
        <input type="hidden" id="editId" />
        <label for="name">Назва *</label>
        <input id="name" required placeholder="Наприклад: Українське радіо" />
        <label for="streamUrl">URL стріму *</label>
        <input id="streamUrl" required placeholder="https://... або http://..." />
        <label for="description">Опис</label>
        <input id="description" placeholder="Короткий опис" />
        <label for="logoUrl">URL логотипу</label>
        <input id="logoUrl" placeholder="https://... (необов'язково)" />
        <div class="row">
          <div>
            <label for="sortOrder">Порядок</label>
            <input id="sortOrder" type="number" value="0" />
          </div>
          <div>
            <label for="isActive">Активне</label>
            <select id="isActive">
              <option value="true">Так</option>
              <option value="false">Ні</option>
            </select>
          </div>
        </div>
        <div class="actions">
          <button type="submit" class="btn btn-primary" id="submitBtn">Додати</button>
          <button type="button" class="btn btn-ghost" id="cancelBtn" style="display:none">Скасувати</button>
        </div>
      </form>
    </div>

    <div class="card">
      <h2>Список радіо <span id="count" style="color:var(--muted);font-weight:400;font-size:0.9rem"></span></h2>
      <div id="list"><p class="empty">Завантаження...</p></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const SUPABASE_URL = 'https://foavkstpeuwxbssfgyee.supabase.co';
    const STORAGE_KEY = 'ua_radio_admin_key';

    let SUPABASE_KEY = localStorage.getItem(STORAGE_KEY) || '';

    function headers() {
      return {
        'apikey': SUPABASE_KEY,
        'Authorization': 'Bearer ' + SUPABASE_KEY,
        'Content-Type': 'application/json',
        'Prefer': 'return=representation'
      };
    }

    const loginScreen = document.getElementById('loginScreen');
    const app = document.getElementById('app');
    const listEl = document.getElementById('list');
    const form = document.getElementById('stationForm');
    const formTitle = document.getElementById('formTitle');
    const submitBtn = document.getElementById('submitBtn');
    const cancelBtn = document.getElementById('cancelBtn');
    const toast = document.getElementById('toast');

    function showToast(msg, isError) {
      toast.textContent = msg;
      toast.className = 'toast show' + (isError ? ' error' : '');
      setTimeout(function () { toast.className = 'toast'; }, 2500);
    }

    function showApp() {
      loginScreen.style.display = 'none';
      app.style.display = 'block';
      loadStations();
    }

    function showLogin() {
      app.style.display = 'none';
      loginScreen.style.display = 'block';
      document.getElementById('keyInput').value = '';
    }

    document.getElementById('loginBtn').onclick = function () {
      var key = document.getElementById('keyInput').value.trim();
      if (!key) { showToast('Встав ключ', true); return; }
      SUPABASE_KEY = key;
      localStorage.setItem(STORAGE_KEY, key);
      showApp();
    };

    document.getElementById('logoutBtn').onclick = function () {
      localStorage.removeItem(STORAGE_KEY);
      SUPABASE_KEY = '';
      showLogin();
    };

    if (SUPABASE_KEY) showApp();

    function resetForm() {
      form.reset();
      document.getElementById('editId').value = '';
      document.getElementById('sortOrder').value = '0';
      document.getElementById('isActive').value = 'true';
      formTitle.textContent = 'Додати радіо';
      submitBtn.textContent = 'Додати';
      cancelBtn.style.display = 'none';
    }
    cancelBtn.onclick = resetForm;

    window.editStation = function (s) {
      document.getElementById('editId').value = s.id;
      document.getElementById('name').value = s.name;
      document.getElementById('streamUrl').value = s.stream_url;
      document.getElementById('description').value = s.description || '';
      document.getElementById('logoUrl').value = s.logo_url || '';
      document.getElementById('sortOrder').value = s.sort_order || 0;
      document.getElementById('isActive').value = String(s.is_active);
      formTitle.textContent = 'Редагувати радіо';
      submitBtn.textContent = 'Зберегти';
      cancelBtn.style.display = 'inline-flex';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    };

    window.deleteStation = async function (id, name) {
      if (!confirm('Видалити «' + name + '»?')) return;
      try {
        var res = await fetch(SUPABASE_URL + '/rest/v1/stations?id=eq.' + id, {
          method: 'DELETE', headers: headers()
        });
        if (!res.ok) throw new Error(await res.text());
        showToast('Видалено');
        loadStations();
      } catch (err) {
        showToast('Помилка: ' + err.message, true);
      }
    };

    form.onsubmit = async function (e) {
      e.preventDefault();
      var id = document.getElementById('editId').value;
      var body = {
        name: document.getElementById('name').value.trim(),
        stream_url: document.getElementById('streamUrl').value.trim(),
        description: document.getElementById('description').value.trim() || null,
        logo_url: document.getElementById('logoUrl').value.trim() || null,
        sort_order: Number(document.getElementById('sortOrder').value) || 0,
        is_active: document.getElementById('isActive').value === 'true'
      };
      try {
        var res;
        if (id) {
          res = await fetch(SUPABASE_URL + '/rest/v1/stations?id=eq.' + id, {
            method: 'PATCH', headers: headers(), body: JSON.stringify(body)
          });
        } else {
          res = await fetch(SUPABASE_URL + '/rest/v1/stations', {
            method: 'POST', headers: headers(), body: JSON.stringify(body)
          });
        }
        if (!res.ok) throw new Error(await res.text());
        showToast(id ? 'Збережено!' : 'Додано!');
        resetForm();
        loadStations();
      } catch (err) {
        showToast('Помилка: ' + err.message, true);
      }
    };

    async function loadStations() {
      try {
        var res = await fetch(SUPABASE_URL + '/rest/v1/stations?order=sort_order.asc', {
          headers: headers()
        });
        if (!res.ok) throw new Error(await res.text());
        var data = await res.json();
        document.getElementById('count').textContent = '(' + data.length + ')';
        if (!data.length) {
          listEl.innerHTML = '<p class="empty">Немає радіо. Додай перше вище ↑</p>';
          return;
        }
        listEl.innerHTML = '';
        data.forEach(function (s) {
          var div = document.createElement('div');
          div.className = 'station' + (s.is_active ? '' : ' inactive');
          var info = document.createElement('div');
          info.className = 'station-info';
          var h3 = document.createElement('h3');
          h3.appendChild(document.createTextNode(s.name + ' '));
          var badge = document.createElement('span');
          badge.className = 'badge' + (s.is_active ? '' : ' off');
          badge.textContent = s.is_active ? 'ON' : 'OFF';
          h3.appendChild(badge);
          var p = document.createElement('p');
          p.textContent = s.description || '';
          var url = document.createElement('div');
          url.className = 'station-url';
          url.textContent = s.stream_url;
          info.appendChild(h3); info.appendChild(p); info.appendChild(url);
          var actions = document.createElement('div');
          actions.className = 'station-actions';
          var editBtn = document.createElement('button');
          editBtn.className = 'btn btn-ghost btn-sm';
          editBtn.textContent = '✏️';
          editBtn.onclick = function () { window.editStation(s); };
          var delBtn = document.createElement('button');
          delBtn.className = 'btn btn-danger btn-sm';
          delBtn.textContent = '🗑';
          delBtn.onclick = function () { window.deleteStation(s.id, s.name); };
          actions.appendChild(editBtn); actions.appendChild(delBtn);
          div.appendChild(info); div.appendChild(actions);
          listEl.appendChild(div);
        });
      } catch (e) {
        listEl.innerHTML = '<p class="empty">Помилка: ' + e.message + '. Можливо неправильний ключ — натисни Вийти і встав Secret key знову.</p>';
      }
    }
  </script>
</body>
</html>
